<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Pages Project</title>
    <!-- Link to your CSS stylesheet if you create one later -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Main Pages Project</h1>
        <p>Welcome to the project root directory.</p>
    </header>

    <main>
        <section>
            <h2>We are working tomorrow</h2>
            <p id="backend-status">Checking backend connection...</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Main Pages Project</p>
    </footer>

    <script>
        const BACKEND_URL = "https://uskulpt-api.webmaster-c58.workers.dev/api/health";

        fetch(BACKEND_URL)
          .then((response) => response.json())
          .then((data) => {
            console.log("Backend response:", data);
            const statusElem = document.getElementById("backend-status");
            if (statusElem) {
              statusElem.textContent = `Backend status: ${data.status}`;
              statusElem.style.color = "#16a34a";
              statusElem.style.fontWeight = "bold";
            }
          })
          .catch((error) => {
            console.error("Error connecting to backend:", error);
            const statusElem = document.getElementById("backend-status");
            if (statusElem) {
              statusElem.textContent = "Backend connection failed.";
              statusElem.style.color = "#dc2626";
            }
          });
    </script>
</body>
</html>
